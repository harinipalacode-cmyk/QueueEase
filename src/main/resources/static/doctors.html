<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>View Doctors - Patient Care</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body>


    <!-- ==================================================
         NAVIGATION BAR
         ================================================== -->
<nav class="navbar">

    <div class="nav-container">

        <a
            href="/index.html"
            class="logo">

            🏥 Patient Care

        </a>

        <div class="nav-links">

            <a href="/index.html">
                Home
            </a>

            <a href="/add-patient.html">
                Add Patient
            </a>

            <a href="/patients.html">
                View Patients
            </a>

            <a href="/add-doctor.html">
                Add Doctor
            </a>

            <a
                href="/doctors.html"
                class="active">

                View Doctors

            </a>

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>

</nav>

    <!-- ==================================================
         DOCTOR RECORDS
         ================================================== -->

    <main class="page-container">

        <div class="page-header">

            <div>

                <h1>

                    Doctor Records

                </h1>

                <p>

                    View and manage doctor records

                </p>

            </div>


            <a
                href="/add-doctor.html"
                class="button primary-button">

                + Add Doctor

            </a>

        </div>


        <p
            id="doctorListMessage"
            class="form-message">

        </p>


        <!-- Doctor Table -->

        <div class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Doctor Name</th>

                            <th>Patient Name</th>

                            <th>Patient Age</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="doctorTableBody">

                        <tr>

                            <td
                                colspan="5"
                                style="text-align:center;">

                                Loading doctors...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script src="/js/script.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (
                    typeof loadDoctors === "function"
                ) {

                    loadDoctors();

                }

            }
        );

    </script>

</body>

</html>
